<!DOCTYPE html>
<html lang="en">
    <!--EN el head van a ir los metadatos del html -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi primer html </title>
    </head>
<!--_En el body va a ir el contenido del html -->
<body>
    <!-- Encabezados -->
    <!-- El header solamente separa contenido a nivel pagina, el usuario no lo percibe-->
    <header>
    <h1>Titulo de la pagina mas importante</h1>
    <h2>Subtitulo</h2>
    <p>Parrafo de texto</p>
    </header>    

    <main>
    <!--Lista No Numerada /  sin orden-->
    <ul>
        <!--Cada elemento de la lista se representa con la etiqueta li-->
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ul>

   <!--Lista numerada / ordenada-->
    <ol>
       <li>Elemento 1</li>
       <li>Elemento 2</li>
       <li>Elemento 3</li>
    </ol>

    <!-- Enlace -->
    <a href="https://www.youtube.com" target="_blank" >Youtube</a> 
    <br />
    <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fmedia.tiempodesanjuan.com%2Fp%2Fb56dc7fbe70e2ed95b99c1b9c69b0ce1%2Fadjuntos%2F331%2Fimagenes%2F000%2F674%2F0000674573%2F790x0%2Fsmart%2Ffuheqaxxwaattcojpg.jpg&f=1&nofb=1&ipt=c0428fcc44f54162cb09c5c68712dafa51db4c4841a59aaad68e22ff188f6b5b" 
    alt="disfrutala">
    </main>
    <footer>
        <p>Hecho por Sebastián</p>
    </footer>
</body>
</html>
