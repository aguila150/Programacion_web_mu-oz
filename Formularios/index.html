<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Hamburgueseria sapardo — Pedidos Online</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Hamburgueseria sapardo</h1>
      <p>Pedidos online</p>
    </header>

    <main>
      <form>
        <div class="contenedor-imagen">
          <img class="logoimg" src="/sapardologo.png" alt="foto logo" />
        </div>

        <h2>Tu pedido</h2>

        <section>
          <h3>Tus datos</h3>

          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" name="telefono" />
        </section>

        <section>
          <h3>Tamaño de guarniciòn de papas</h3>

          <input type="radio" id="chica" name="tamanio" value="chica" />
          <label for="chica">Chica</label>

          <input type="radio" id="mediana" name="tamanio" value="mediana" />
          <label for="mediana">Mediana</label>

          <input type="radio" id="grande" name="tamanio" value="grande" />
          <label for="grande">Grande</label>
        </section>

        <section>
          <h3>Tipo de Pan</h3>

          <label for="pan">Elegí tu pan</label>
          <select id="pan" name="pan" required>
            <option value="">-- Elegí una --</option>
            <option value="clasica">Clásica</option>
            <option value="delgada">Pan de papa</option>
            <option value="rellena">Pan de viena</option>
          </select>
        </section>

        <section>
          <h3>Ingredientes extra</h3>

          <input
            type="checkbox"
            id="cheddar"
            name="ingrediente_cheddar"
            value="cheddar"
          />
          <label for="cheddar">Queso cheddar extra</label>

          <input
            type="checkbox"
            id="jamon"
            name="ingrediente_jamon"
            value="jamon"
          />
          <label for="jamon">Jamón</label>

          <input
            type="checkbox"
            id="cebolla_caramelizada"
            name="ingrediente_cebolla_caramelizada"
            value="cebolla_caramelizada"
          />
          <label for="cebolla_caramelizada">Cebolla caramelizada</label>
        </section>

        <section>
          <h3>Cantidad</h3>

          <label for="cantidad">¿Cuántas hamburguesas?</label>
          <input
            type="number"
            id="cantidad"
            name="cantidad"
            min="1"
            max="10"
            value="1"
            required
          />
        </section>

        <section>
          <h3>Comentarios</h3>

          <label for="comentarios">¿Algo más que quieras avisarnos?</label>
          <textarea id="comentarios" name="comentarios" rows="4"></textarea>
        </section>

        <button type="submit">Hacer pedido</button>
      </form>
    </main>

    <footer>
      <p>Hamburgueseria sapardo — La Matanza, Buenos Aires</p>
    </footer>
  </body>
</html>
